name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single-file exe
        shell: cmd
        run: build.cmd

      - name: Check artifact
        shell: pwsh
        run: |
          if (-not (Test-Path DeskFence.exe)) { throw "DeskFence.exe was not produced" }
          "{0:N0} bytes" -f (Get-Item DeskFence.exe).Length

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: DeskFence.exe
          generate_release_notes: true
          draft: false
